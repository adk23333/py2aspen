[project]
name = "py2aspen"
version = "0.1.0"
description = "A Python wrapper for Aspen Plus built on comtypes."
readme = "README.md"
authors = [{ name = "SanLiy" }]
license = { text = "BSD-3-Clause" }
requires-python = ">=3.12"
dependencies = [
    "comtypes>=1.4",
    "loguru>=0.7.3",
]
[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
