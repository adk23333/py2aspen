[project]
name = "py2aspen"
version = "0.2.1"
description = "A Python wrapper for Aspen Plus built on comtypes."
readme = "README.md"
authors = [{ name = "SanLiy" }]
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
dependencies = [
    "comtypes>=1.4",
    "loguru>=0.7.3",
]
[project.urls]
"Home page" = "https://github.com/adk23333/py2aspen"
Repository = "https://github.com/adk23333/py2aspen.git"
GitHub = "https://github.com/adk23333/py2aspen"
[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = ["F403"]
